name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
      - run: uvx ruff@0.16.0 check .

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
      - run: uv build --wheel

  vtk-tools:
    name: Build VTK tools & run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install system dependencies
        shell: bash -l {0}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libsm-dev \
            libx11-dev \
            libxt-dev \
            libxext-dev \
            xvfb
          sudo ln -sv /usr/lib/x86_64-linux-gnu /usr/lib64

      - name: Install Python and conda dependencies
        shell: bash -l {0}
        run: |
          conda install -y -n base conda-libmamba-solver
          conda config --set solver libmamba
          conda install -y -c conda-forge --override-channels \
            python=3.12 \
            vtk=9.3.* \
            mesalib \
            numpy \
            nibabel \
            pandas \
            matplotlib \
            nipype \
            nose \
            etelemetry \
            tbb-devel
          pip install colormath pytest pytest-timeout pytest-forked
          python - <<'PY'
          import numpy as np
          if not hasattr(np, "asscalar"):
              np.asscalar = lambda a: a.item()
          PY
          python -m pip install --no-build-isolation --no-deps .

      - name: Build VTK C++ tools
        shell: bash -l {0}
        run: |
          mkdir -p vtk_cpp_tools/bin
          cd vtk_cpp_tools/bin
          cmake ../ -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          make -j2

      - name: Run current tests
        shell: bash -l {0}
        env:
          MB: ${{ github.workspace }}/src/mindboggle
        run: |
          export PATH="$PATH:${{ github.workspace }}/vtk_cpp_tools/bin"
          xvfb-run -a python -m pytest --doctest-modules --timeout=30 -v "$MB/"
