[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mindboggle"
description = "Automated human brain image feature extraction, labeling, and shape analysis"
readme = "README.rst"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Arno Klein", email = "arno@childmind.org" }]
maintainers = [{ name = "Child Mind Institute" }]
keywords = ["neuroimaging", "brain", "morphometry", "MRI", "labeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# Runtime dependencies. This is the full set actually imported by the package;
# the old setup.py REQUIRES was incomplete because conda supplied numpy/scipy/etc.
# silently. Deliberate version pinning is tracked separately (backlog: P1-3);
# slimming (colormath/bokeh/nilearn -> extras or removal) is P2-4;
# nipype is transitional and removed by the niwrap migration (Phase 3).
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "networkx",
    "nibabel",
    "nilearn",
    "vtk",
    "colormath",
    "etelemetry",
    "nipype",
    "bokeh",
]
# Single-sourced from mindboggle/version.py (read statically, no package import).
dynamic = ["version"]

[dependency-groups]
dev = ["ruff==0.16.0", "pytest", "pytest-timeout"]

[project.urls]
Homepage = "https://mindboggle.info/"
Repository = "https://github.com/childmindresearch/mindboggle"
Documentation = "https://mindboggle.readthedocs.io/"

[tool.setuptools]
# src/ layout: the package lives under src/.
package-dir = { "" = "src" }
# Explicit package list (mirrors the old setup.py) so the scratch `mindboggle/x`
# tree is not shipped.
packages = [
    "mindboggle",
    "mindboggle.data",
    "mindboggle.evaluate",
    "mindboggle.features",
    "mindboggle.guts",
    "mindboggle.mio",
    "mindboggle.shapes",
    "mindboggle.shapes.zernike",
    "mindboggle.thirdparty",
]
# The two pipeline entry points are extension-less scripts whose logic runs at
# module top level (no `main()`), so they stay as legacy installed scripts for
# now. Converting them to `[project.scripts]` console entry points needs a
# `main()` refactor that belongs with the Phase 3 pipeline rewrite.
script-files = [
    "src/mindboggle/mindboggle",
    "src/mindboggle/mindboggle123",
    "colors_script/calc_colormap.py",
    "colors_script/convert_to_mipav_lut.py",
]

[tool.setuptools.package-data]
mindboggle = ["data/*.nii.gz", "data/*.txt"]

[tool.pytest.ini_options]
addopts = [
  "--ignore=src/mindboggle/testzernikecompatinit.py",
  "--ignore=src/mindboggle/testzernikecompat*.py",
  "--ignore=src/mindboggle/testzernikemultiproc*.py",
  "--ignore=src/mindboggle/x/test_zernike/compat",
  "--ignore=src/mindboggle/x/test_zernike/multiproc",
]

[tool.setuptools.dynamic]
version = { attr = "mindboggle.version.__version__" }

[tool.ruff]
target-version = "py312"
line-length = 88
# Scratch/dead code (Python 2 remnants live here); triaged separately (P2-4).
extend-exclude = ["src/mindboggle/x"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    # === Disabled on purpose (NOT debt): these fight the formatter or the
    #     project's idioms, so we do not plan to re-enable them. ===
    "E501",   # line-too-long: `ruff format` owns line width; what remains is
              # long strings/URLs/comments it deliberately won't wrap.
    "RUF059", # unused-unpacked-variable: unpacking and using only some values
              # is idiomatic in this tuple-heavy numeric code.

    # === Ratchet debt: pre-existing violations to fix and re-enable, one
    #     family at a time, then delete the entry here. Safe autofixes are
    #     already applied, so the rest needs `ruff check --unsafe-fixes` plus
    #     review, or manual work. New code is still checked against every rule
    #     NOT listed here. ===

    # -- Likely-real bug smells: investigate first, some may be real bugs (#11) --
    "F821",   # undefined-name
    "F841",   # unused-variable
    "F521",   # string-dot-format-invalid-format
    "B006",   # mutable-argument-default
    "B008",   # function-call-in-default-argument
    "B018",   # useless-expression
    "B020",   # loop-variable-overrides-iterator
    "B023",   # function-uses-loop-variable

    # -- Mechanical cleanups: unsafe-autofix + review, or manual (#10) --
    "B007",   # unused-loop-control-variable
    "B904",   # raise-without-from-inside-except
    "B905",   # zip-without-explicit-strict
    "E402",   # module-import-not-at-top-of-file
    "E711",   # none-comparison (== None -> is None)
    "E722",   # bare-except
    "E731",   # lambda-assignment
    "E741",   # ambiguous-variable-name (l / I / O)
    "UP030", "UP031",
    "C402", "C404", "C408", "C410", "C414", "C416", "C419",
    "SIM101", "SIM102", "SIM105", "SIM108", "SIM113", "SIM115", "SIM116",
    "RUF002", "RUF005", "RUF012", "RUF015", "RUF017",
]

[tool.ruff.lint.per-file-ignores]
# Entry scripts are not imported as modules.
"src/mindboggle/mindboggle" = ["E402"]
"src/mindboggle/mindboggle123" = ["E402"]
